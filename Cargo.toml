[package]
name = "slugplan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Creates a project's .planning/ folder and its README the same way in every slug tool."
license-file = "LICENSE"
repository = "https://github.com/SlugThugLabs/slugplan"
readme = "README.md"
keywords = ["planning", "workspace"]
categories = ["development-tools"]
publish = false

[dependencies]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
print_stdout = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
